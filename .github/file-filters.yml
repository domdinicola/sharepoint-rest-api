# This is used by the action https://github.com/dorny/paths-filter
dependencies: &dependencies
  - 'uv.lock'
  - 'pyproject.toml'

python: &python
  - added|modified: 'src/**'
  - added|modified: 'tests/**'
  - 'manage.py'

changelog:
  - added|modified: 'changes/**'
  - 'CHANGELOG.md'

run_tests:
  - *python
  - *dependencies
  - 'pytest.ini'

migrations:
  - added|modified: 'src/**/migrations/*'

lint:
  -  *python
  - '.flake8'
  - 'pyproject.toml'
